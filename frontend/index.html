<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TEXORA - Iniciar sesión</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <header class="cabecera">
        <div class="cabecera-contenido">
            <a class="logo" href="./">TEXORA</a>
        </div>
    </header>

    <main class="contenido contenido-auth">
        <section id="seccion-auth">
            <form id="form-login" novalidate>
                <h1>Iniciar sesión</h1>

                <label>Email
                    <input type="email" name="email" autocomplete="email" required>
                </label>

                <label>Contraseña
                    <input type="password" name="password" autocomplete="current-password" required>
                </label>

                <p class="error" role="alert"></p>
                <button type="submit" class="boton boton-ancho">Entrar</button>

                <p class="enlace-auth">
                    ¿No tienes cuenta? <a href="registro.html">Regístrate</a>
                </p>
            </form>
        </section>
    </main>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>

</body>
</html>
