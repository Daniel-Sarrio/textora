<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TEXORA</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <header class="cabecera">
        <div class="cabecera-contenido">
            <a class="logo" href="./">TEXORA</a>

            <div class="zona-sesion">
                <!-- Usuario identificado -->
                <div id="usuario-activo" class="acciones" hidden>
                    <span class="saludo">Hola, <strong id="nombre-usuario"></strong></span>
                    <button type="button" id="boton-logout" class="boton boton-borde">Cerrar sesión</button>
                </div>
                <!-- Sin sesión -->
                <div id="usuario-anonimo" class="acciones">
                    <button type="button" id="boton-mostrar-login" class="boton boton-borde">Iniciar sesión</button>
                    <button type="button" id="boton-mostrar-registro" class="boton">Registrarse</button>
                </div>
            </div>
        </div>
    </header>

    <main class="contenido">
        <section class="portada">
            <h1>Tejidos con carácter</h1>
            <p>Catálogo textil con productos de ES-TELA</p>
        </section>

        <section id="seccion-auth" hidden>
            <form id="form-login" novalidate>
                <h2>Iniciar sesión</h2>
                <label>Email
                    <input type="email" name="email" autocomplete="email" required>
                </label>
                <label>Contraseña
                    <input type="password" name="password" autocomplete="current-password" required>
                </label>
                <p class="error" role="alert"></p>
                <button type="submit" class="boton boton-ancho">Entrar</button>
            </form>

            <form id="form-registro" novalidate hidden>
                <h2>Crear cuenta</h2>
                <label>Nombre
                    <input type="text" name="name" autocomplete="name" minlength="2" maxlength="100" required>
                </label>
                <label>Email
                    <input type="email" name="email" autocomplete="email" required>
                </label>
                <label>Contraseña (mínimo 8 caracteres)
                    <input type="password" name="password" autocomplete="new-password" minlength="8" maxlength="128" required>
                </label>
                <label>Repite la contraseña
                    <input type="password" name="password2" autocomplete="new-password" required>
                </label>
                <p class="error" role="alert"></p>
                <button type="submit" class="boton boton-ancho">Registrarme</button>
            </form>
        </section>

        <h2 class="titulo-seccion">Productos disponibles</h2>

        <pre id="productos">Cargando productos...</pre>
    </main>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>

</body>
</html>
