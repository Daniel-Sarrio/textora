<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TEXORA - Catálogo</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body hidden>

    <header class="cabecera">
        <div class="cabecera-contenido">
            <a class="logo" href="catalogo.html">TEXORA</a>

            <div class="acciones">
                <span class="saludo">Hola, <strong id="nombre-usuario"></strong></span>
                <button type="button" id="boton-logout" class="boton boton-borde">Cerrar sesión</button>
            </div>
        </div>
    </header>

    <main class="contenido">
        <section class="portada">
            <h1>Tejidos de la Vall</h1>
            <p>Catálogo textil con productos de ES-TELA</p>
        </section>

        <section class="seccion-productos" aria-labelledby="titulo-productos">
            <div class="selectores-catalogo">
                <label for="selector-familia">
                    Familia
                    <select id="selector-familia" disabled>
                        <option value="">Cargando familias...</option>
                    </select>
                </label>

                <label for="selector-subfamilia">
                    Subfamilia
                    <select id="selector-subfamilia" disabled>
                        <option value="">Selecciona primero una familia</option>
                    </select>
                </label>
            </div>

            <h2 id="titulo-productos" class="titulo-seccion">Productos disponibles</h2>
            <p id="estado-productos" class="estado-productos" role="status">
                Cargando familias...
            </p>
            <div id="productos" class="catalogo-productos"></div>
        </section>
    </main>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/catalogo.js"></script>

</body>
</html>
